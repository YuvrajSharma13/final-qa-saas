services:
  - type: web
    name: ai-qa-saas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ALLOW_PRIVATE_TARGETS
        value: "true"
      - key: AUTOFIX_ENABLED
        value: "true"
      - key: QA_CONCURRENCY
        value: "1"
