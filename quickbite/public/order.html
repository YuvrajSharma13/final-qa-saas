<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order status · QuickBite</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
</head>
<body>
<main>
<div class="card" style="max-width:560px;margin:0 auto">
  <div id="order-loading" class="muted">Loading your order…</div>
  <div id="order-success" class="hidden" role="status">
    <h1>Order confirmed!</h1>
    <p id="order-greeting"></p>
    <p>Order <strong id="order-id"></strong> · Total <strong id="order-total"></strong></p>
    <a class="btn btn-secondary" href="/menu">Order more</a>
  </div>
  <div id="order-error" class="alert alert-error hidden" role="alert">We could not load your order confirmation. Please contact support.</div>
</div>
</main>
<script>renderHeader('');</script>
<script src="/js/order.js"></script>
</body>
</html>
