<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · QuickBite</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
</head>
<body>
<main>
<div class="card" style="max-width:420px;margin:0 auto">
  <h1>Sign in</h1>
  <div id="login-error" class="alert alert-error hidden" role="alert"></div>
  <div id="login-success" class="alert alert-success hidden" role="status"></div>
  <form id="login-form" novalidate>
    <div class="form-row"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username"></div>
    <div class="form-row"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
</main>
<script>renderHeader('login');</script>
<script src="/js/login.js"></script>
</body>
</html>
